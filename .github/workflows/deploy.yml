name: Deploy

# Deploys main to DreamHost after the PHP 8.5 gate passes: a merge
# (or push) to main runs php85.yml, and its successful completion
# triggers this workflow. Renaming the CI workflow means updating the
# workflows list below. The server pulls current main, not the triggering
# run's SHA; this gate does not guarantee that a newer revision has passed.
on:
  workflow_run:
    workflows: ["PHP 8.5"]
    types: [completed]
    branches: [main]

# One deploy at a time: a queued deploy waits rather than racing the
# checkout on the server. This does not serialize manual SSH deployments.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Secrets flow through env rather than inline ${{ }} interpolation
      # in the run script (command-injection hygiene per GitHub's docs).
      - name: Install the deploy key and the pinned host key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Run cli/deploy.sh on the server
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: >
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes
          "${DEPLOY_USER}@${DEPLOY_HOST}"
          "cd '${DEPLOY_PATH}' && ./cli/deploy.sh"
